global:
  scrape_interval: 5s

scrape_configs:
  - job_name: "devcollab-api"
    metrics_path: "/api/metrics"
    static_configs:
      - targets:
          - "host.docker.internal:5000"

  - job_name: "devcollab-outbox-worker"
    metrics_path: "/metrics"
    static_configs:
      - targets:
          - "host.docker.internal:9465"